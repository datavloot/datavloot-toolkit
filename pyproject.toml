[project]
name = "datavloot"
version = "0.1.0"
description = "Open, modular, Python-native data platform — from a laptop to a fleet, without vendor lock-in."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "python-dotenv",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
optimist = [
    "altair>=6.0",
    "dagster>=1.13.6",
    "dagster-dbt>=0.29.6",
    "dagster-dlt>=0.29.6",
    "dagster-duckdb>=0.29.6",
    "dagster-webserver>=1.13.6",
    "dbt-core>=1.11",
    "dbt-duckdb>=1.10",
    "dlt[duckdb]>=1.28",
    "ducklake>=0.1.1",
    "elementary-data[duckdb]>=0.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "marimo>=0.23.9",
    "pandas>=2.0",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest",
]

[project.scripts]
datavloot = "datavloot_platform.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]   # >=1.27 for PEP 639 license/license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datavloot_platform"]

[tool.dagster]
module_name = "datavloot_platform.definitions"
code_location_name = "datavloot-toolkit"
