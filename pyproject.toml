[project]
name = "datavloot"
version = "0.1.2"
description = "Open, modular, Python-native data platform — from a laptop to a fleet, without vendor lock-in."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "python-dotenv",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
optimist = [
    "altair>=6.0",
    "dagster>=1.13.6",
    "dagster-dbt>=0.29.6",
    "dagster-dlt>=0.29.6",
    "dagster-duckdb>=0.29.6",
    "dagster-webserver>=1.13.6",
    "dbt-core>=1.11",
    "dbt-duckdb>=1.10",
    "dlt[duckdb]>=1.28",
    "ducklake>=0.1.1",
    "elementary-data[duckdb]>=0.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "marimo>=0.23.9",
    "pandas>=2.0",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest",
    "pyyaml>=6.0",
]

[project.scripts]
datavloot = "datavloot_platform.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]   # >=1.27 for PEP 639 license/license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datavloot_platform"]

# Hatchling honours only the ROOT .gitignore, so anything hidden by a nested one
# ships unless it is listed here. That is how the 0.1.1 wheel reached PyPI at
# 66.9 MB / 276 MB unpacked, over 99% of it frontend build input.
#
# frontend/ is excluded wholesale, not just its build output: only crowsnest/
# static/ is ever served, so the Next.js source is build input for maintainers,
# who get it from the repository. Excluding it also means FRONTEND_DIR is
# genuinely absent in an installed package, which is what check_static_freshness()
# already assumes.
#
# tests/test_packaging.py enforces all of this against the built artifact.
exclude = [
  "datavloot_platform/crowsnest/frontend",
  "datavloot_platform/templates/*/target",
  "datavloot_platform/templates/*/dbt_packages",
  "datavloot_platform/templates/*/logs",
  "*.duckdb",
]

[tool.dagster]
module_name = "datavloot_platform.definitions"
code_location_name = "datavloot-toolkit"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs dbt deps/parse/run; needs dbt and network. Deselect with -m 'not slow'.",
    "package: builds a wheel and inspects it; slow. Deselect with -m 'not package'.",
]
