[project]
name = "optimist-toolkit"
version = "0.1.0"
description = "Open-source data platform toolkit — Dagster + dlt + dbt + DuckDB + Elementary"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "altair",
    "dagster",
    "dagster-dbt",
    "dagster-dlt",
    "dagster-duckdb",
    "dagster-webserver",
    "dbt-core",
    "dbt-duckdb",
    "dlt[duckdb]",
    "ducklake",
    "elementary-data[duckdb]",
    "marimo",
    "pandas",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
optimist = "optimist_platform.cli:main"

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimist_platform"]

[tool.dagster]
module_name = "optimist_platform.definitions"
code_location_name = "optimist-toolkit"
