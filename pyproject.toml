[project]
name = "optimist-toolkit"
version = "0.1.0"
description = "Open-source data platform toolkit — Dagster + dlt + dbt + DuckDB + Elementary"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "altair>=6.0",
    "dagster>=1.13.6",
    "dagster-dbt>=0.29.6",
    "dagster-dlt>=0.29.6",
    "dagster-duckdb>=0.29.6",
    "dagster-webserver>=1.13.6",
    "dbt-core>=1.11",
    "dbt-duckdb>=1.10",
    "dlt[duckdb]>=1.28",
    "ducklake>=0.1.1",
    "elementary-data[duckdb]>=0.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "marimo>=0.23.9",
    "pandas>=2.0",
    "python-dotenv",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
datavloot = "optimist_platform.cli:main"

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimist_platform"]

[tool.dagster]
module_name = "optimist_platform.definitions"
code_location_name = "optimist-toolkit"
