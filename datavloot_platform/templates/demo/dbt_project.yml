name: 'noaa'
version: '1.0.0'
profile: 'noaa'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# `+database` is what lets this project move vessels without edits. On the Optimist
# it is the DuckDB file's own catalog name (the default anyway). On the Valk the
# Compose overlay sets DATAVLOOT_DBT_DATABASE to the attached DuckLake catalog, so
# every model, seed and Elementary table lands in the shared lakehouse instead of
# the in-memory database the valk target opens.

seeds:
  noaa:
    +schema: seeds
    +database: "{{ env_var('DATAVLOOT_DBT_DATABASE', 'noaa') }}"

models:
  elementary:
    +schema: elementary
    +database: "{{ env_var('DATAVLOOT_DBT_DATABASE', 'noaa') }}"
  noaa:
    +database: "{{ env_var('DATAVLOOT_DBT_DATABASE', 'noaa') }}"
    source:
      +schema: source
      ais:
        +materialized: incremental    # upsert on new broadcasts; pair with unique_key + incremental_column in the model
      open_meteo:
        +materialized: ephemeral      # dlt owns incrementality; inline into downstream models at compile time
    business:
      +materialized: table
      +schema: business
