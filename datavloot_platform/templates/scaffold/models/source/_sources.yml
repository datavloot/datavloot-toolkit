version: 2

sources:
  - name: <source_name>           # used as first arg in stage_source() and source()
    description: ""
    # Keep the env_var: on the Valk the raw tables live in the shared DuckLake catalog,
    # and DATAVLOOT_DBT_DATABASE points dbt at it. Locally it resolves to the DuckDB file.
    database: "{{ env_var('DATAVLOOT_DBT_DATABASE', '<project_name>') }}"
    schema: <schema>

    # Freshness checks — dbt source freshness will warn/error if the source
    # hasn't received new data within these thresholds.
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: <timestamp_column>   # column dbt uses to evaluate freshness

    tables:
      - name: <table_name>        # used as second arg in stage_source()
        description: ""

        columns:
          - name: <primary_key_column>
            description: ""
            data_tests:
              - unique
              - not_null
          - name: <column_name>
            description: ""
