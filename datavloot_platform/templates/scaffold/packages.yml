packages:
  # The release the datavloot toolkit that created this project was tested with.
  # A tarball rather than `git:` so that `dbt deps` works on a machine without git.
  - tarball: "https://codeload.github.com/datavloot/dbt-datavloot-optimist/tar.gz/refs/tags/<dbt_package_version>"
    name: optimist
  # The Crows Nest's Data quality and Catalog panels read the tables Elementary writes.
  # Same range as elementary-data (the edr CLI) in the datavloot toolkit, so the two match.
  - package: elementary-data/elementary
    version: [">=0.25.0", "<0.26.0"]
