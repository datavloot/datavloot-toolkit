version: 2

seeds:

  - name: locations
    description: "The weather locations, one per region of the Netherlands. Read by dbt (dim_location) and by the open_meteo dlt asset, which fetches the weather for each of them."
    columns:
      - name: location_code
        description: "Short code for the location; the natural key."
        data_tests:
          - unique
          - not_null
      - name: location_name
        description: "Name of the place."
        data_tests:
          - not_null
      - name: region
        description: "Region of the Netherlands the location stands for: coast, centre or south."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['coast', 'centre', 'south']
      - name: latitude
        description: "Latitude in decimal degrees (WGS84)."
        data_tests:
          - not_null
      - name: longitude
        description: "Longitude in decimal degrees (WGS84)."
        data_tests:
          - not_null
