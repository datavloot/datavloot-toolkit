[project]
name = "spotify"
version = "0.1.0"
description = "Your own Spotify listening history — Dagster + dlt + dbt + DuckDB, built on the datavloot toolkit"
requires-python = ">=3.10,<3.15"
dependencies = [
    "datavloot[optimist]~=<toolkit_version>",  # storage.py: how assets and notebooks reach the lake
    "altair>=6.2.1",
    "dagster",
    "dagster-dbt",
    "dagster-dlt",
    "dagster-webserver",
    "dbt-core",
    "dbt-duckdb",
    "dlt[duckdb]",
    "duckdb",
    "marimo>=0.23.9",
    "pandas>=2.3.3",
    "python-dotenv",
    "requests",
]

[tool.uv]
# Only lock versions that install on these platforms (e.g. loro 1.19.0 has no Windows wheel).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64' and platform_python_implementation == 'CPython'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotify_platform"]

[tool.dagster]
module_name = "spotify_platform.definitions"
code_location_name = "spotify"
