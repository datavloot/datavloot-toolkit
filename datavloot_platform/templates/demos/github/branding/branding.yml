# How the Crows Nest presents this project. Every key is optional.
#
# name: shown at the top left of the Crows Nest and in the browser tab. Optimist
#   is datavloot on a laptop; change it to Falcon on a VM, or to your
#   organisation's own name.
# colors: this demo dresses the Crows Nest like a code host: a dark sidebar,
#   blue links and buttons, and the green of a contribution graph.
# A logo.svg or logo.png next to this file replaces the mark and the name in
# the sidebar.
name: Optimist
colors:
  accent: "#0969da"      # buttons, links, spinner
  text: "#1f2328"        # text; muted text is derived from it
  background: "#f6f8fa"  # page background; hover and borders are derived from it
  sidebar: "#24292f"     # the sidebar
  highlight: "#2da44e"   # the active tab's marker, focus rings, notes
