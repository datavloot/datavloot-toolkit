version: 2

sources:
  - name: github
    description: >
      Your GitHub account through the REST and GraphQL APIs, loaded by the github Dagster asset
      via dlt (github_platform/github.py). Until an account is connected, the same tables hold a
      made-up developer (github_platform/sample.py); `origin` on every row says which.
    schema: source    # dlt dataset_name

    tables:
      - name: profile
        description: "One row: the account the data comes from, replaced on every run. origin = 'sample' or 'github'."
        columns:
          - name: login
            data_tests:
              - not_null
              - unique
          - name: origin
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['sample', 'github']

      - name: repositories
        description: "Your own repositories (up to 100, most recently pushed first), forks included; replaced on every run."
        columns:
          - name: repository_id
            data_tests:
              - not_null
              - unique

      - name: repository_languages
        description: "Bytes of code per language per repository, as GitHub counts them; forks left out."

      - name: commits
        description: "Your commits to your own repositories, merged on sha, so commits stay when a repository goes."
        columns:
          - name: sha
            data_tests:
              - not_null
              - unique

      - name: contribution_days
        description: "Your contribution calendar: one row per day since the account was made (at most ten years)."
        columns:
          - name: contribution_date
            data_tests:
              - not_null
              - unique
