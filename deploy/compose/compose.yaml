# The Falcon: the platform behind Traefik, over HTTPS, behind a sign-in.
#
#   dagster.<DOMAIN>     Dagster UI       (dagster-webserver; dagster-daemon runs schedules)
#   crowsnest.<DOMAIN>   Crows Nest
#   marimo.<DOMAIN>      Marimo notebooks
#   apps.<DOMAIN>        the project's apps (marimo run apps/), shown in the Crows Nest's Dashboards
#
# Only Traefik publishes ports. Every router goes through the `auth` middleware,
# from traefik/auth-${FALCON_AUTH}.yml: basic auth (users.htpasswd), or oidc,
# single sign-on through the customer's identity provider with oauth2-proxy.
# The one exception is the Crows Nest's /api/health, for an uptime check.
# Settings come from .env, see .env.example. Run from this directory:
#   docker compose up -d --build

name: falcon

x-falcon: &falcon
  image: falcon-platform:local
  pull_policy: never
  restart: unless-stopped
  working_dir: /srv/falcon/${PROJECT:-noaa}
  environment: &environment
    PROJECT_DIR: /srv/falcon/${PROJECT:-noaa}
  volumes:
    - ${FALCON_DIR:-/srv/falcon}:/srv/falcon
    - dagster_home:/dagster_home
  depends_on:
    prepare:
      condition: service_completed_successfully

services:
  # One-off: creates the demo if asked, installs dbt packages, builds the manifest.
  prepare:
    <<: *falcon
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        FALCON_UID: ${FALCON_UID:-1000}
        FALCON_GID: ${FALCON_GID:-1000}
    pull_policy: build
    restart: "no"
    working_dir: /srv/falcon
    environment:
      <<: *environment
      FALCON_DEMO: ${FALCON_DEMO:-0}
    command: falcon-prepare
    depends_on: {}

  dagster-webserver:
    <<: *falcon
    command: dagster-webserver --host 0.0.0.0 --port 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.dagster.rule=Host(`dagster.${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.dagster.entrypoints=websecure
      - traefik.http.routers.dagster.middlewares=auth@file
      - traefik.http.services.dagster.loadbalancer.server.port=3000

  # Runs schedules (lake maintenance) and the run queue, so it shares the
  # webserver's DAGSTER_HOME.
  dagster-daemon:
    <<: *falcon
    command: dagster-daemon run

  crowsnest:
    <<: *falcon
    command: datavloot launch --host 0.0.0.0 --port 8080 --no-open
    environment:
      <<: *environment
      CROWSNEST_DAGSTER_URL: http://dagster-webserver:3000/graphql
      CROWSNEST_DAGSTER_PUBLIC_URL: https://dagster.${DOMAIN}
      CROWSNEST_MARIMO_URL: http://marimo:2718
      CROWSNEST_MARIMO_PUBLIC_URL: https://marimo.${DOMAIN}
      CROWSNEST_APPS_URL: http://apps:2719
      CROWSNEST_APPS_PUBLIC_URL: https://apps.${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.crowsnest.rule=Host(`crowsnest.${DOMAIN}`)
      - traefik.http.routers.crowsnest.entrypoints=websecure
      - traefik.http.routers.crowsnest.middlewares=auth@file
      # The health check only, without a sign-in, so an uptime monitor can reach
      # it. It answers which services are up ({"services": {"dagster": "ok", ...}})
      # and nothing about the data.
      - traefik.http.routers.crowsnest-health.rule=Host(`crowsnest.${DOMAIN}`) && Path(`/api/health`)
      - traefik.http.routers.crowsnest-health.entrypoints=websecure
      - traefik.http.services.crowsnest.loadbalancer.server.port=8080

  # Its own service rather than started by the Crows Nest as on a laptop: one
  # notebook server for everyone, reachable by its own URL. Marimo runs the
  # notebooks' code on this machine, so it must never be reachable without the
  # sign-in in front of it.
  marimo:
    <<: *falcon
    command: marimo edit notebooks --host 0.0.0.0 --port 2718 --headless --no-token
    labels:
      - traefik.enable=true
      - traefik.http.routers.marimo.rule=Host(`marimo.${DOMAIN}`)
      - traefik.http.routers.marimo.entrypoints=websecure
      - traefik.http.routers.marimo.middlewares=auth@file
      - traefik.http.services.marimo.loadbalancer.server.port=2718

  # The project's apps: the notebooks in apps/, read-only and without their
  # code, for the people who read the results. One server for every app; the
  # Crows Nest shows them in its Dashboards tab. prepare creates apps/ when the
  # project has none, or this service would not start.
  apps:
    <<: *falcon
    command: marimo run apps --host 0.0.0.0 --port 2719 --headless --no-token
    labels:
      - traefik.enable=true
      - traefik.http.routers.apps.rule=Host(`apps.${DOMAIN}`)
      - traefik.http.routers.apps.entrypoints=websecure
      - traefik.http.routers.apps.middlewares=auth@file
      - traefik.http.services.apps.loadbalancer.server.port=2719

  # FALCON_AUTH=oidc only (the profile follows from COMPOSE_PROFILES in .env).
  # Traefik asks it about every request (traefik/auth-oidc.yml), and it sends
  # whoever is not signed in to the customer's identity provider. /oauth2/ on
  # every host comes here, so the provider calls back on the host the user
  # started from: register https://<host>/oauth2/callback for each of them.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    profiles: [oidc]
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: ${OIDC_PROVIDER_NAME:-your organisation}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-}
      # Entra ID often leaves `email` out of the token: preferred_username then.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      # A provider that reports email_verified=false (Keycloak does for a user
      # without a verified address) is refused, unless this is true.
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: ${OIDC_ALLOW_UNVERIFIED_EMAIL:-false}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      # Empty: whoever the provider signs in gets in.
      OAUTH2_PROXY_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      # Set explicitly: with allowed groups oauth2-proxy would add a `groups` scope
      # of its own, which Keycloak and Entra ID refuse as unknown (invalid_scope),
      # and nobody can sign in. The groups arrive as a claim instead.
      OAUTH2_PROXY_SCOPE: ${OIDC_SCOPE:-openid email profile}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: file:///dev/null
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
    labels:
      - traefik.enable=true
      - traefik.http.routers.oauth2.rule=(Host(`crowsnest.${DOMAIN}`) || Host(`dagster.${DOMAIN}`) || Host(`marimo.${DOMAIN}`) || Host(`apps.${DOMAIN}`)) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth2.entrypoints=websecure
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/auth-${FALCON_AUTH:-basic}.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
      - letsencrypt:/letsencrypt

volumes:
  dagster_home:
  letsencrypt:
