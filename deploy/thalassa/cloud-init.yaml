#cloud-config
# First boot only (see the lifecycle block in main.tf). Leaves a VM with Docker
# and a deploy user; the Compose stack itself is put in place afterwards.

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
packages:
  # From Ubuntu's own archive, so unattended-upgrades keeps them patched.
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - git

write_files:
  # Docker's default json-file logs grow without limit.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "local",
        "log-opts": { "max-size": "20m", "max-file": "5" }
      }

runcmd:
  - systemctl enable --now docker
  - systemctl restart docker
  - install -d -o deploy -g deploy /srv/optimist
