# Fast-forward the moving X.Y.x branch when a bare X.Y.Z tag is pushed.
#
# Skipping this by hand fails silently: the tag exists, the release looks
# shipped, and every consumer tracking X.Y.x stays on the previous version --
# dbt only warns about unpinned revisions for the literal strings HEAD, main
# and master.
#
# GitLab did this with a project access token (GITLAB_PUSH_TOKEN). On GitHub the
# built-in GITHUB_TOKEN can push branches once this workflow is granted
# `contents: write` -- UNLESS the X.Y.x branch has a protection rule, which the
# default GITHUB_TOKEN cannot bypass. In that case either:
#   - allow the "github-actions[bot]" app to push to that branch in the rule's
#     bypass list, or
#   - create a fine-grained PAT / GitHub App token with "Contents: write" on this
#     repo, store it as the secret RELEASE_PUSH_TOKEN, and set
#     `token: ${{ secrets.RELEASE_PUSH_TOKEN }}` on the checkout step below.

name: Release

on:
  push:
    tags: ['+([0-9]).+([0-9]).+([0-9])']   # bare X.Y.Z only; datavloot-vX.Y.Z never matches

jobs:
  fast-forward-minor-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # a branch fast-forward needs real history
          # token: ${{ secrets.RELEASE_PUSH_TOKEN }}   # uncomment if X.Y.x is protected

      - name: Fast-forward the X.Y.x branch to this tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a bare X.Y.Z release tag; nothing to do."
            exit 0
          fi
          MINOR_BRANCH="$(echo "$TAG" | cut -d. -f1,2).x"
          echo "Fast-forwarding $MINOR_BRANCH to $TAG ($GITHUB_SHA)"
          git fetch origin "$MINOR_BRANCH" || echo "$MINOR_BRANCH does not exist yet; it will be created"
          git push origin "${GITHUB_SHA}:refs/heads/${MINOR_BRANCH}"
